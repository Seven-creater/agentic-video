name: Current package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[library,test]'
      - run: python -m pytest -q tests/test_hot_batch.py tests/test_visual_library.py tests/test_server_cli.py tests/test_server_jobs.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/check_installation.py
