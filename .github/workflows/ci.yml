name: Package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install development package
        run: python -m pip install -e ".[test]"
      - name: Check layout and offline contracts
        run: python -m pytest -q tests/test_source_layout.py tests/test_pipeline.py tests/test_api.py tests/test_library_contracts.py tests/test_mcp_http_events.py tests/test_mcp_json_hash_cache.py tests/test_opencode_provider.py tests/test_library_opencode_guard.py tests/test_server_cli.py tests/test_server_jobs.py tests/test_server_generation_profile.py tests/test_server_capacity_resume_jobs.py tests/test_server_capacity_recovery.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel instead of editable package
        run: python -c "import pathlib, subprocess, sys; wheel = next(pathlib.Path('dist').glob('*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)"
      - name: Check installed wheel without model calls
        run: python -I scripts/check_installation.py --expect-wheel
