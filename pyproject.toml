[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-autonomous-screenplay"
version = "0.1.0"
description = "Reference-driven visual storytelling and editing from a movie library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
library = ["Pillow>=11", "faster-whisper>=1.2,<2", "av>=16,<17", "numpy"]
capture = ["playwright==1.64.0"]

[project.scripts]
omni-server = "omni_story.library.server_cli:main"
omni-hot-video = "omni_story.library.hot_pipeline:main"
omni-audio = "omni_story.library.visual_audio:main"
omni-visual-library = "omni_story.library.visual_indexer:main"
omni-eval = "omni_story.evaluation.cli:main"
omni-reliable = "omni_story.library.reliable_cli:main"
omni-template-eval = "omni_story.evaluation.template_cli:main"
omni-reference-eval = "omni_story.evaluation.reference_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["omni_story*"]

[tool.setuptools.package-data]
"omni_story.library" = [
    "*.mjs",
    "craft_knowledge/*.md",
    "craft_knowledge/catalogue.json",
    "craft_knowledge/cards/*.md",
    "resources/visual_story_finecut/*.md",
    "resources/visual_story_finecut/references/*.md",
    "resources/original_rough_v1/*.json",
    "resources/historical_selected_review_v1/*.json",
    "resources/historical_selected_review_v1/*.txt",
    "resources/visual_audio/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
